<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="menu" class="menu">
        <div class="item" data-action="edit">編集</div>
        <div class="item" data-action="delete">削除</div>
    </div>

    <!-- この上の要素はjsで操作する-->
    <!-- この下から表示 -->

    <h1>Bookmark Manager</h1>

    <div>
        ブックマーク追加：
        <input id="bookmark-title-input" placeholder="title">
        <input id="bookmark-url-input" placeholder="url">
        <button id="bookmark-add-button">追加</button>
        <div id="bookmark-input-error", class="error-message"></div>
    </div>

    <div>
        グループを追加：
        <input id="group-title-input" placeholder="title">
        <button id="group-add-button">追加</button>
        <div id="group-input-error", class="error-message"></div>
    </div>

    <hr>

    <button id="back-button">戻る</button>


    <ul id="list", class="grid"></ul>

    <script type="module" src="src/main.js"></script>
</body>
